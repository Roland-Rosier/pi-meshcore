# RFM9x/SX127x device configurations
devices:
  rfm95:
    name: "RFM95"
    min_radio_freq_hz: 868000000
    max_radio_freq_hz: 915000000
    osc_freq_hz: 32000000

  rfm97:
    name: "RFM97"
    min_radio_freq_hz: 434000000
    max_radio_freq_hz: 460000000
    osc_freq_hz: 32000000

  rfm96:
    name: "RFM96"
    min_radio_freq_hz: 868000000
    max_radio_freq_hz: 915000000
    osc_freq_hz: 32000000

  rfm98:
    name: "RFM98"
    min_radio_freq_hz: 434000000
    max_radio_freq_hz: 460000000
    osc_freq_hz: 32000000

  sx1276:
    name: "SX1276"
    min_radio_freq_hz: 868000000
    max_radio_freq_hz: 915000000

  sx1277:
    name: "SX1277"
    min_radio_freq_hz: 434000000
    max_radio_freq_hz: 460000000

  sx1278:
    name: "SX1278"
    min_radio_freq_hz: 434000000
    max_radio_freq_hz: 460000000

  sx1279:
    name: "SX1279"
    min_radio_freq_hz: 868000000
    max_radio_freq_hz: 915000000

# Family configurations
families:
  rfm9x:
    family_name: "RFM9X"
    devices:
      - "RFM95"
      - "RFM97"
      - "RFM96"
      - "RFM98"
    exclusions:
      - device_name: "RFM95"
        excluded_freq_hz: 434000000
      - device_name: "RFM97"
        excluded_freq_hz: 868000000
      - device_name: "RFM96"
        excluded_freq_hz: 434000000
      - device_name: "RFM98"
        excluded_freq_hz: 868000000

  sx127x:
    family_name: "SX127X"
    devices:
      - "SX1276"
      - "SX1277"
      - "SX1278"
      - "SX1279"
    exclusions:
      - device_name: "SX1276"
        excluded_freq_hz: 434000000
      - device_name: "SX1277"
        excluded_freq_hz: 868000000
      - device_name: "SX1278"
        excluded_freq_hz: 868000000
      - device_name: "SX1279"
        excluded_freq_hz: 434000000

# Module configurations
modules:
  lora_pi_434_868:
    module_name: "LoRa Pi 434/868"
    devices:
      - device_name: "RFM98"
        spi_device_id: 0
        ce_number: 1
        antenna_type: "parabolic"
        antenna_gain_db: 24.0
        dio_gpio_mappings:
          - "DIO0:GPIO16"
          - "DIO5:GPIO12"
      - device_name: "RFM95"
        spi_device_id: 0
        ce_number: 0
        antenna_type: "parabolic"
        antenna_gain_db: 25.0
        dio_gpio_mappings:
          - "DIO0:GPIO25"
          - "DIO5:GPIO24"
