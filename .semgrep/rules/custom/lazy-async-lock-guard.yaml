rules:
  # 1. Detect old sentinel pattern (deprecated in Plan-28)
  - id: sentinel-pattern-deprecated
    languages:
      - python
    severity: ERROR
    message: "Sentinel (_SENTINEL) pattern deprecated — use LazyAsyncLock instead"
    patterns:
      - pattern: _SENTINEL = object()

  # 2. Detect lock read in an else-branch outside the guard (sentinel race risk)
  - id: else-branch-outside-guard
    languages:
      - python
    severity: ERROR
    message: "Else-branch reads the lock outside the guard — sentinel race risk. Use LazyAsyncLock."
    patterns:
      - pattern-either:
          - pattern: |
              if $LOCK is None:
                  $LOCK = $Y.Lock()
              else:
                  ...
      - pattern-not-inside: |
          with $GUARD:
              ...
              $LOCK = $Y.Lock()
      - pattern-not-inside: |
          async with $GUARD:
              ...
              $LOCK = $Y.Lock()

  # 3. Detect manual double-checked locking (should use LazyAsyncLock)
  - id: manual-double-checked-locking
    languages:
      - python
    severity: ERROR
    message: "Manual double-checked locking — use LazyAsyncLock instead"
    patterns:
      - pattern-either:
          - pattern: |
              if $LOCK is None:
                  $LOCK = $Y.Lock()
      - pattern-not-inside: |
          with $GUARD:
              ...
              $LOCK = $Y.Lock()
      - pattern-not-inside: |
          async with $GUARD:
              ...
              $LOCK = $Y.Lock()
