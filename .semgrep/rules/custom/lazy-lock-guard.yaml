rules:
  - id: lazy-lock-without-guard
    languages:
      - python
    severity: ERROR
    message: |
      Lazy lock initialization without a guard lock is a race condition. Two
      concurrent callers can each pass the `if $LOCK is None:` check and create
      separate locks, breaking mutual exclusion. Create the lock under a
      module-level guard lock using double-checked locking. See
      pi_lora/drivers/rfm9x_sx127x_config_loader.py (_init_lock) and
      pi_lora/drivers/spi/locks.py (_registry_init_lock) for the correct pattern.
    patterns:
      - pattern-either:
          - pattern: |
              if $LOCK is None:
                  ...
                  $LOCK = $Y.Lock()
          - pattern: |
              if $LOCK is None:
                  $LOCK = $Y.Lock()
      - pattern-not-inside: |
          async with $GUARD:
              ...
              if $LOCK is None:
                  ...
                  $LOCK = $Y.Lock()
      - pattern-not-inside: |
          if $OUTER_LOCK is None:
              if $GUARD_LOCK is None:
                  $GUARD_LOCK = asyncio.Lock()
              async with $GUARD_LOCK:
                  ...
    metadata:
      category: correctness
      technology:
        - python
    # CR-3 FIX: This rule produces false positives on valid double-checked
    # locking (e.g. config_loader.py and locks.py), where the `if $LOCK is
    # None` check is intentionally nested inside a guard lock. The
    # pattern-not-inside guards are incomplete and must be hardened to reject
    # the guarded pattern before accepting the bare pattern as an ERROR.
