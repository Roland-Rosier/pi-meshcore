[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pi_lora"

# -----------------------------------------------------------------------------
# Project metadata
# -----------------------------------------------------------------------------
[project]
name = "pi-lora"
version = "0.0.1"
description = "MeshCore Client/Repeater on Raspberry Pi 4 with Uputronics LoRa Hat"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

authors = [
    { name = "Roland Rosier", email = "" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Hardware :: Raspberry Pi",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Topic :: System :: Hardware",
]

# -----------------------------------------------------------------------------
# Runtime dependencies (installed with `uv sync` / `pip install .`)
# -----------------------------------------------------------------------------
dependencies = [
    # Core hardware drivers — required for RPi + LoRa Hat operation
    "spidev>=3.8",
    "gpiod>=2.4",

    # CLI framework (Typer, with Click/Rich/Shellingame extras)
    "typer[all]>=0.19",

    # --- Optional: MeshCore protocol library ---
    # Uncomment the line below if you need MeshCore client/repeater functionality.
    # This package is optional because it may not be ultimately needed, and some
    # users may only want to scan frequencies without the full MeshCore stack.
    # "meshcore>=2.3",

    # --- Optional: Web interface (FastAPI + uvicorn) ---
    # Uncomment both lines below if you plan to use the web dashboard.
    # "fastapi>=0.115",
    # "uvicorn>=0.34",
]

# -----------------------------------------------------------------------------
# Optional dependency groups
# -----------------------------------------------------------------------------
[project.optional-dependencies]
# Full MeshCore stack (client + repeater protocol implementation)
meshcore = [
    "meshcore>=2.3",
]

# Web interface (FastAPI API server and dashboard)
web = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

# All optional features combined
all = [
    "meshcore>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

# -----------------------------------------------------------------------------
# Development dependencies (installed with `uv sync --group dev`)
# -----------------------------------------------------------------------------
[dependency-groups]
dev = [
    # Static type checking
    "mypy>=1.8",

    # Testing and coverage
    "pytest-cov>=4.1",
    "coverage[toml]>=7.0",

    # Linting (Rust-based, ~100x faster than flake8)
    "ruff>=0.9,<0.10",

    # SAST-based linting (Semgrep for security/supply-chain patterns)
    "semgrep>=1.9",
]

# -----------------------------------------------------------------------------
# No CLI entry points yet — real CLI not developed
# (Will be added when src/cli/ is ready)
# [project.scripts]
# pi-lora-check = "src.cli.check_hardware:main"

# No ASGI application module yet — web interface not implemented


# =============================================================================
# Tool configurations (pytest, coverage, mypy)
# =============================================================================

[tool.pytest.ini_options]
addopts = "--cov=src --cov=tests --cov-report=term-missing --cov-report=html --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src", "tests"]
omit = [
    "*/test_*.py",       # Exclude test files from coverage measurement
    "*/__init__.py",     # Exclude __init__ files
]

[tool.coverage.report]
show_missing = true
fail_under = 90          # CI should fail if coverage drops below 90%
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# -----------------------------------------------------------------------------
# mypy configuration (dev-only)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["spidev"]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# ruff configuration (linting)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

# Exclude generated / non-source directories.
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    "home/",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors (E4, E5, E7, E9)
    "F",       # Pyflakes (unused imports, undefined names, redefinition)
    "I",       # isort (import sorting)
    "UP",      # pyupgrade (Python 3.10+ modernization)
    "B",       # flake8-bugbear (common bugs and design problems)
    "SIM",     # flake8-simplify (code simplification suggestions)
    "T20",     # flake8-print (print statement detection)
    "W",       # pycodestyle warnings (W29, W39) — minimal
]

ignore = [
    "E501",    # Line too long — handled by docstrings and type-hint comments
    "T201",    # print() calls are intentional for hardware status output
    "SIM108",  # Use if-else instead of try/except/else — existing code style
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files contain only license headers (long lines) and no imports.
"src/**/__init__.py" = ["E501", "F401"]
"tests/**/__init__.py" = ["E501", "F401"]

# Files that intentionally append to sys.path for import resolution on RPi, and tests using bare Exception.
"src/pi_lora/cli/check_hardware.py" = ["E402", "B008"]
"src/pi_lora/drivers/lora_detection.py" = ["E402"]
"tests/test_lora_module_detection.py" = ["E402", "B017"]

# Tests that verify simulated SPI failures use bare Exception intentionally.
"tests/test_fakes.py" = ["B017"]

[tool.ruff.lint.isort]

known-first-party = ["pi_lora.drivers", "pi_lora.cli", "tests.fakes"]
force-single-line = false
combine-as-imports = true
order-by-type = true
relative-imports-order = "closest-to-furthest"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

# -----------------------------------------------------------------------------
# semgrep configuration (SAST-based linting)
# -----------------------------------------------------------------------------
[tool.semgrep]
language = "python"
strictness = "default"
ruling = ["security", "supply-chain"]

[tool.semgrep.lint]
severity = "error"
paths = ["src", "tests"]
exclude = [
    ".git",
    ".pytest_cache",
    "*.egg-info",
    "build",
    "dist",
]

[tool.semgrep.ignores]
# Tests using simulated SPI failures intentionally trigger generic exceptions.
"tests/**" = ["semgrep.lang.python.generic-error"]


